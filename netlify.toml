[build]
  publish = "."

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"

# 쿠팡 사진을 Netlify 이미지 CDN으로 줄여서·캐시해서 보여 준다 (관리자 화면 속도)
[images]
  remote_images = ["https://[a-z0-9]+\\.coupangcdn\\.com/.*", "https://lh3\\.googleusercontent\\.com/d/.*"]
